# CodeQL static analysis (SAST) of the Go code, on every branch push, on pull requests from forks
# and weekly. Findings go to code scanning. OpenSSF Scorecard's SAST check counts the commits that
# CodeQL checked. It is not part of ci-ok: code scanning's own check reports new findings.
name: CodeQL

on:
  pull_request:
  push:
    branches: ["**"] # every branch; tags need no analysis of their own
  schedule:
    - cron: "23 4 * * 3"

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('codeql-pr-{0}', github.ref)
    || github.ref == 'refs/heads/main' && format('codeql-{0}', github.sha)
    || format('codeql-branch-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: codeql (go)
    # As in ci.yml: a branch of this repository is analysed by its push run, a fork's pull request by
    # its pull_request run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No GOTOOLCHAIN before setup-go (docs/PLAN.md §11.1).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # CodeQL must see a full build, not a cached one
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: manual
      - name: Build
        run: go build ./...
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go
