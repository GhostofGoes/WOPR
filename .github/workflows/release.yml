# Releases on v* tags: verify → build and rebuild (in parallel) → smoke, repro and the installers →
# collect → sign → publish → docs and the snaps.
# workflow_dispatch runs everything but verify, sign, publish and docs as a dry run, and never publishes.
# sign is the only job with the signing key (the release environment's secret), and runs before the
# only job with a write token, publish; CI signs every build with a throwaway key instead.
# The release notes come from .changes/ (AGENTS.md, "Releasing"): build and rebuild both write them
# with internal/tools/relnotes into build/notes (WOPR_NOTES_DIR), which .gitignore keeps out of the
# tree that GoReleaser needs clean.
# The installers (windows.yml's setup.exe, macos.yml's .dmg) and the snaps (snap.yml) are built on
# their own runners from build's release files, never compiled again. collect adds the installers
# to the release files and checksums.txt, which sign signs and publish attests; repro compares
# GoReleaser's own files only, so the installers are signed and attested but not checked for
# reproducibility. The snaps and the MSIX packages are workflow artifacts for the stores and never
# release files.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 50 # most of it waiting for CI on a commit tagged right after its merge
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Tag is semver, on main, and CI passed for its commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag ${TAG} is not vMAJOR.MINOR.PATCH"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "::error::${TAG} is not on main"; exit 1; }
          # Every ci-ok that GitHub Actions posted on the commit must have passed; a check run with
          # the same name from another app does not count. A run still in progress reads "pending".
          # A tag pushed right after its merge arrives before main's CI run has finished (or posted
          # ci-ok at all), so missing and pending are waited out, for up to 45 minutes.
          deadline=$((SECONDS + 45 * 60))
          while :; do
            result="$(gh api "repos/${REPO}/commits/${GITHUB_SHA}/check-runs?check_name=ci-ok" --jq '
              [.check_runs[] | select(.app.slug == "github-actions") | .conclusion]
              | if length == 0 then "missing"
                elif all(. == "success") then "success"
                else map(select(. != "success")) | first // "pending" end')"
            case "${result}" in
              success) break ;;
              missing | pending) ;;
              *) echo "::error::ci-ok is ${result} for ${GITHUB_SHA}"; exit 1 ;;
            esac
            if (( SECONDS >= deadline )); then
              echo "::error::ci-ok is still ${result} for ${GITHUB_SHA} after 45 minutes"
              exit 1
            fi
            echo "ci-ok is ${result} for ${GITHUB_SHA}; waiting for CI to finish"
            sleep 30
          done

  build:
    name: build
    needs: verify
    # A dry run skips verify; without an explicit condition every later job would be skipped too.
    if: ${{ !cancelled() && (needs.verify.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.verify.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # never restore a cache into a release build
      # notes.md (the release body), CHANGELOG.md, and changelog.yml (the .deb and .rpm changelogs),
      # from .changes/vX.Y.Z.md, or batched here from .changes/unreleased, with a warning, when the
      # release pull request did not.
      - name: Release notes
        env:
          WOPR_NOTES_DIR: build/notes
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "${DRY_RUN}" == "true" ]]; then
            go run ./internal/tools/relnotes -snapshot -out "${WOPR_NOTES_DIR}"
          else
            go run ./internal/tools/relnotes -version "${TAG}" -out "${WOPR_NOTES_DIR}"
          fi
      - name: GoReleaser (no publish)
        env:
          SNAPSHOT: ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
          WOPR_NOTES_DIR: build/notes
        run: go tool -modfile=tools/release/go.mod goreleaser release --clean --skip=publish ${SNAPSHOT:+"$SNAPSHOT"}
      # GoReleaser's .Version, which names the installers and the snaps: the tag without its v, or a
      # dry run's snapshot version.
      - name: Version
        id: version
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(jq -r .version dist/metadata.json)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::dist/metadata.json has no usable version: ${version}"
            exit 1
          fi
          if [[ "${DRY_RUN}" != "true" && "${version}" != "${TAG#v}" ]]; then
            echo "::error::GoReleaser built ${version}, not the tag's ${TAG#v}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Size gate
        run: go run ./internal/tools/sizegate -expect 6 -packages 4
      # dist/release gets every file GoReleaser made for the release, each checked against
      # checksums.txt; collect adds the installers.
      - name: Stage binaries, check archive and package contents, collect the release files
        run: go run ./internal/tools/stage -archives -assets dist/release
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-stage
          path: stage/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/release/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: build/notes/
          retention-days: 7
          if-no-files-found: error

  smoke:
    name: smoke
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions: {}
    uses: $/.github/workflows/smoke.yml
    with:
      artifact: release-stage

  # The installers, built from release-dist and tested on Windows (x64 and Arm64) and macOS (Apple
  # silicon and Intel). Each called workflow checks out the repository for its packaging files, so
  # it needs contents: read. windows.yml also uploads the MSIX packages for a Store submission.
  windows:
    name: windows
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
    uses: $/.github/workflows/windows.yml
    with:
      artifact: release-dist
      version: ${{ needs.build.outputs.version }}

  macos:
    name: macos
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    permissions:
      contents: read
    uses: $/.github/workflows/macos.yml
    with:
      artifact: release-dist
      version: ${{ needs.build.outputs.version }}
      stage-artifact: release-stage

  # Adds the installers to the release files and to checksums.txt (stage -merge sorts it as
  # GoReleaser does and checks every file again), after the same size budget as the binaries.
  # sign signs what this uploads, and publish attests and uploads what sign uploads.
  collect:
    name: collect
    needs: [build, windows, macos]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.windows.result == 'success'
      && needs.macos.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-windows
          path: build/installers
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-macos
          path: build/installers
      - name: Size gate (installers)
        run: >-
          go run ./internal/tools/sizegate -files
          "build/installers/wopr_${VERSION}_windows_setup.exe" "build/installers/wopr_${VERSION}_macos.dmg"
      - name: Add the installers to the release files and checksums.txt
        run: >-
          go run ./internal/tools/stage -merge -assets dist/release
          "build/installers/wopr_${VERSION}_windows_setup.exe" "build/installers/wopr_${VERSION}_macos.dmg"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-files
          path: dist/release/
          retention-days: 7
          if-no-files-found: error

  rebuild:
    name: rebuild
    needs: verify
    # The same condition as build, which it runs beside rather than after.
    if: ${{ !cancelled() && (needs.verify.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.verify.result == 'skipped')) }}
    runs-on: ubuntu-24.04-arm # a different host architecture must give identical archives
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The same notes as build's, so that the packages that carry them come out byte-identical.
      - name: Release notes
        env:
          WOPR_NOTES_DIR: build/notes
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "${DRY_RUN}" == "true" ]]; then
            go run ./internal/tools/relnotes -snapshot -out "${WOPR_NOTES_DIR}"
          else
            go run ./internal/tools/relnotes -version "${TAG}" -out "${WOPR_NOTES_DIR}"
          fi
      - name: Rebuild
        env:
          SNAPSHOT: ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
          WOPR_NOTES_DIR: build/notes
        run: go tool -modfile=tools/release/go.mod goreleaser release --clean --skip=publish ${SNAPSHOT:+"$SNAPSHOT"}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuild-checksums
          path: dist/checksums.txt
          retention-days: 7
          if-no-files-found: error

  # GoReleaser's own checksums.txt from both builds, before collect adds the installers and sign
  # signs the .rpm packages: the installers are built once, from these files, and signed and
  # attested only.
  repro:
    name: reproducible
    needs: [build, rebuild]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.rebuild.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: first
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rebuild-checksums
          path: second
      - name: Compare checksums
        run: diff -u first/checksums.txt second/checksums.txt

  # Signs the .rpm packages, writes a detached signature for each .deb and for checksums.txt, and
  # rewrites checksums.txt (packaging/sign-packages.sh; docs/PLAN.md §8, "Signatures"). The key is
  # the release environment's WOPR_SIGNING_KEY secret (with WOPR_SIGNING_PASSPHRASE if it has one),
  # and must be the committed packaging/wopr-signing-key.asc, whose fingerprint is
  # packaging/wopr-signing-key.fingerprint. The environment allows only v* tags (AGENTS.md,
  # "Repository settings"). It signs collect's files, so checksums.txt and its signature list the
  # installers too. What it signs is first checked against the rebuild's checksums: every file the
  # rebuild made must be here, byte for byte; the installers, which the rebuild does not make,
  # against checksums.txt.
  sign:
    name: sign
    needs: [verify, build, rebuild, collect]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.verify.result == 'success'
      && needs.build.result == 'success' && needs.rebuild.result == 'success' && needs.collect.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The release files with the installers, from collect.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: build/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rebuild-checksums
          path: build/rebuild
      - name: Check the files against both builds' checksums
        run: |
          missing="$(grep -vxFf build/release/checksums.txt build/rebuild/checksums.txt || true)"
          if [[ -n "${missing}" ]]; then
            echo "::error::files that differ from the rebuild's:"
            echo "${missing}"
            exit 1
          fi
          (cd build/release && sha256sum --strict -c checksums.txt)
      - name: Install rpmsign
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends rpm
      - name: Sign
        env:
          WOPR_SIGNING_KEY: ${{ secrets.WOPR_SIGNING_KEY }}
          WOPR_SIGNING_PASSPHRASE: ${{ secrets.WOPR_SIGNING_PASSPHRASE }}
        run: |
          for f in packaging/wopr-signing-key.asc packaging/wopr-signing-key.fingerprint; do
            if [[ ! -s "${f}" ]]; then
              echo "::error::${f} is missing; AGENTS.md, \"Repository settings\", says how to make the signing key"
              exit 1
            fi
          done
          packaging/sign-packages.sh build/release packaging/wopr-signing-key.asc packaging/wopr-signing-key.fingerprint
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-signed
          path: build/release/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    needs: [verify, build, rebuild, smoke, repro, windows, macos, collect, sign]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && needs.verify.result == 'success'
      && needs.build.result == 'success' && needs.smoke.result == 'success' && needs.repro.result == 'success'
      && needs.windows.result == 'success' && needs.macos.result == 'success' && needs.collect.result == 'success'
      && needs.sign.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      discussions: write # the release's discussion
    steps:
      # The release files with the installers (collect), signed (sign).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-signed
          path: assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: notes
      # What is attested is what sign checked and signed: every file matches the new checksums.txt.
      - name: Check the files against checksums.txt
        run: (cd assets && sha256sum --strict -c checksums.txt)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: assets/checksums.txt
      # checksums.txt and its signature are published too, so they are attested as well, and every
      # release file has an attestation.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            assets/checksums.txt
            assets/checksums.txt.asc
      # Archives, bare binaries, .deb and .rpm packages and the .deb's .asc signatures, the Windows
      # installer, the macOS disk image, LICENSE, README.md, NOTICE.md, THIRD_PARTY_NOTICES.txt,
      # checksums.txt and checksums.txt.asc.
      # The body is relnotes's notes.md; GitHub's generated notes stand in only if it is empty.
      # Publishing also starts a discussion of the release in the Announcements category, which
      # GitHub creates with Discussions; if that fails (the category was renamed, say), the release is
      # published without one and the run warns, since a release matters more than its discussion. The
      # run's summary links the discussion.
      - name: Create the release as a draft, upload, then publish with a discussion
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DISCUSSION_CATEGORY: Announcements
        run: |
          notes=(--notes-file notes/notes.md)
          if [[ ! -s notes/notes.md ]]; then
            echo "::warning::notes.md is empty, so the release uses GitHub's generated notes"
            notes=(--generate-notes)
          fi
          gh release create "${TAG}" --repo "${REPO}" --draft --verify-tag "${notes[@]}" assets/*
          if ! gh release edit "${TAG}" --repo "${REPO}" --draft=false --discussion-category "${DISCUSSION_CATEGORY}"; then
            echo "::warning::publishing ${TAG} with a discussion in ${DISCUSSION_CATEGORY} failed (see the error above); publishing it without one"
            gh release edit "${TAG}" --repo "${REPO}" --draft=false
          fi
          discussion="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq '.discussion_url // ""' || true)"
          if [[ -n "${discussion}" ]]; then
            echo "Published ${TAG}, with its discussion: ${discussion}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::${TAG} is published with no discussion; start one from the release's Edit page"
          fi

  # docs.yml publishes the docs site from main, naming the latest published release in its download
  # commands; it ran when the release pull request merged, before this release existed, so it runs
  # again now. A run started with GITHUB_TOKEN through workflow_dispatch is the one kind such a token
  # may start.
  docs:
    name: docs
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # gh workflow run starts docs.yml
    steps:
      - name: Publish the docs site again
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run docs.yml --repo "${REPO}" --ref main

  # The snaps, packed from release-dist and tested, after publish so that the Snap Store never gets
  # a version the GitHub release lacks. snap.yml uploads them only for a tag, when the repository
  # variable SNAP_PUBLISH is true, in the snap-store environment, after the owner approves; until
  # then its publish job is skipped (AGENTS.md). The environment's secret reaches the called
  # workflow only when passed by name here. A dry run builds and tests them.
  snap:
    name: snap
    needs: [build, publish]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success'
      && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
    uses: $/.github/workflows/snap.yml
    with:
      artifact: release-dist
      version: ${{ needs.build.outputs.version }}
      stage-artifact: release-stage
      publish: ${{ github.event_name == 'push' }}
    secrets:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
