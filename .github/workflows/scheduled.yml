# Weekly health report: vulnerabilities, outdated modules and hooks, stale notices.
# Without Dependabot (owner decision), this is how drift becomes visible. Findings go to one
# tracking issue. GitHub disables schedules after 60 days without repository activity;
# AGENTS.md's milestone checklist re-enables it.
name: Scheduled checks

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  report:
    name: weekly report
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: 0.5.5
          install-only: true
      - name: Collect findings
        id: collect
        shell: bash
        run: |
          set +e
          found=0
          {
            echo "## govulncheck"
            if ! go tool -modfile=tools/go.mod govulncheck ./... ; then found=1; fi
            echo "## Outdated modules"
            go list -m -u -f '{{if .Update}}{{.Path}} {{.Version}} -> {{.Update.Version}}{{end}}' all | grep . && found=1
            echo "## Outdated hooks"
            if ! prek update --check ; then found=1; fi
            echo "## Third-party notices"
            if ! go run ./internal/tools/notices -check ; then found=1; fi
          } > report.md 2>&1
          echo "found=${found}" >> "${GITHUB_OUTPUT}"
          cat report.md
      - name: Open or update the tracking issue
        if: steps.collect.outputs.found == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          title="Weekly dependency and vulnerability report"
          number="$(gh issue list --repo "${REPO}" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --repo "${REPO}" --body-file report.md
          else
            gh issue create --repo "${REPO}" --title "${title}" --body-file report.md
          fi
