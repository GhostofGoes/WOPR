# Weekly health report: vulnerabilities, Go patch releases, outdated modules and hooks, stale notices.
# Without Dependabot (owner decision), this is how drift becomes visible. Findings go to one
# tracking issue. GitHub disables schedules after 60 days without repository activity;
# AGENTS.md's milestone checklist re-enables it.
name: Scheduled checks

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  report:
    name: weekly report
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a weekly run would only restore a stale cache, and save one nobody uses
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          prek-version: 0.5.5
          install-only: true
      - name: Collect findings
        id: collect
        shell: bash
        # A finding (something to update or fix) goes to the tracking issue. A check that could
        # not run (network, a failed hook fetch) fails the job instead, so it is not filed as a
        # finding. Indirect module upgrades are left to govulncheck and the milestone checklist.
        run: |
          set +e
          found=0
          errors=0
          {
            echo "## govulncheck"
            go tool -modfile=tools/go.mod govulncheck ./...
            case $? in 0) ;; 3) found=1 ;; *) errors=1 ;; esac

            # A Go patch release can fix the standard library in code govulncheck finds unreachable,
            # and SECURITY.md's response rule counts from the release, so every one is reported.
            echo "## Go toolchain"
            current="$(go list -m -f '{{.Version}}' toolchain)" || errors=1
            latest="$(go list -m -f '{{.Version}}' toolchain@patch)" || errors=1
            if [[ -n "${current}" && -n "${latest}" && "${current}" != "${latest}" ]]; then
              echo "toolchain ${current} -> ${latest}"
              found=1
            fi

            echo "## Outdated direct dependencies"
            out="$(go list -m -u -f '{{if and .Update (not .Indirect) (not .Main)}}{{.Path}} {{.Version}} -> {{.Update.Version}}{{end}}' all)" || errors=1
            if [[ -n "${out}" ]]; then echo "${out}"; found=1; fi

            echo "## Outdated tools"
            for modfile in tools/go.mod tools/lint/go.mod tools/release/go.mod; do
              mapfile -t mods < <(go list -modfile="${modfile}" -f '{{.Module.Path}}' tool | sort -u)
              if [[ ${#mods[@]} -eq 0 ]]; then errors=1; continue; fi
              out="$(go list -modfile="${modfile}" -m -u -f '{{if .Update}}{{.Path}} {{.Version}} -> {{.Update.Version}}{{end}}' "${mods[@]}")" || errors=1
              if [[ -n "${out}" ]]; then echo "${out}"; found=1; fi
            done

            echo "## Outdated hooks"
            out="$(prek update --check 2>&1)"
            echo "${out}"
            if grep -q 'update failed' <<<"${out}"; then errors=1; fi
            if grep -q 'would update' <<<"${out}"; then found=1; fi

            echo "## Third-party notices"
            # Built, not run with go run, which exits 1 for any failure: the tool exits 1
            # when the file is out of date and 2 when it could not check.
            if go build -o "${RUNNER_TEMP}/notices" ./internal/tools/notices; then
              "${RUNNER_TEMP}/notices" -check
              case $? in 0) ;; 1) found=1 ;; *) errors=1 ;; esac
            else
              errors=1
            fi
          } > report.md 2>&1
          echo "found=${found}" >> "${GITHUB_OUTPUT}"
          echo "errors=${errors}" >> "${GITHUB_OUTPUT}"
          cat report.md
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FOUND: ${{ steps.collect.outputs.found }}
          ERRORS: ${{ steps.collect.outputs.errors }}
        run: |
          title="Weekly dependency and vulnerability report"
          # Only this workflow's own issue: nobody else's issue with the same title.
          number="$(gh issue list --repo "${REPO}" --state open --author "app/github-actions" --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')"
          if [[ "${FOUND}" == "1" && -n "${number}" ]]; then
            gh issue comment "${number}" --repo "${REPO}" --body-file report.md
          elif [[ "${FOUND}" == "1" ]]; then
            gh issue create --repo "${REPO}" --title "${title}" --body-file report.md
          elif [[ -n "${number}" && "${ERRORS}" != "1" ]]; then # a check that did not run found nothing either
            gh issue close "${number}" --repo "${REPO}" --comment "This week's checks found nothing to update."
          fi
      - name: Fail if a check could not run
        if: steps.collect.outputs.errors == '1'
        run: |
          echo "::error::a check could not run; the log above shows which"
          exit 1
