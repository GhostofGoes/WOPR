# CI for every branch push and for pull requests from forks. The only required check is ci-ok
# (see AGENTS.md). A pull request from a branch of this repository is checked by that branch's
# push run, which reports ci-ok on the same head commit, so its pull_request run skips every
# job rather than run the same work twice. A fork's pushes never reach this repository, so its
# pull requests run in full.
name: CI

on:
  pull_request:
  push:
    branches: ["**"] # every branch; tags go to release.yml

permissions: {}

# Pull requests share a group per PR, and other branches a group per branch; both cancel
# superseded runs. Pushes to main get a group per commit: a shared group would let a newer
# pending run replace an older pending one, leaving a merged commit without ci-ok.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref)
    || github.ref == 'refs/heads/main' && format('ci-{0}', github.sha)
    || format('ci-branch-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # main and the tags, for the change-note checks
      # No GOTOOLCHAIN before setup-go: with GOTOOLCHAIN=local set, setup-go ignores
      # go.mod's toolchain line. setup-go exports GOTOOLCHAIN=local itself afterwards.
      # Each job's cache is keyed on the modules it builds: jobs sharing one key race to save
      # it, and the first to finish (often the smallest) wins for everyone.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The hooks run `go mod tidy -diff` in every module and build changie (relnotes -check); the
          # self-test builds golangci-lint; the cooldown lists every module's build list, the site's too.
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/lint/go.sum
            tools/release/go.sum
            tools/docs/go.sum
            site/go.sum
      # For the desktop-files hook: the validators of the menu entries and the AppStream metadata,
      # Ubuntu 24.04's (Linux tools, not pinned, as in smoke.yml). With WOPR_DESKTOP_VALIDATORS=1, its
      # test fails instead of skipping when one is missing.
      - name: Install the desktop file validators
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends desktop-file-utils appstream appstream-util
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        env:
          WOPR_DESKTOP_VALIDATORS: "1"
        with:
          prek-version: 0.5.5
      - name: Lint rules still fire
        env:
          WOPR_LINT_SELFTEST: "1"
        run: go test -run 'TestLintRulesFire' -v ./internal/archtest
      # A branch that changes code players use (cmd/, internal/ but tests, test data and tools) must add
      # a change note, or say "Changelog: none" in a commit trailer (AGENTS.md, "Change notes").
      # On main, and on a fork's pull request merged with it, the base is main itself.
      - name: Change note for user-visible changes
        run: go run ./internal/tools/relnotes -since origin/main
      # No module in any build list may be newer than 14 days at this commit (AGENTS.md, "Dependency cooldown").
      - name: Dependency cooldown
        run: go run ./internal/tools/cooldown
      - name: zizmor online audits
        env:
          GH_TOKEN: ${{ github.token }}
        run: prek run zizmor --all-files

  secrets:
    name: secrets
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum # gitleaks only
      - name: gitleaks (full history)
        shell: bash
        # Scans the checked-out commit's history (a branch, or a fork's PR merged with main), not
        # every branch: a stale branch must not block every PR. gitleaks exits 0 when git fails, so
        # errors and an empty scan are caught from the log, which --no-color keeps greppable.
        run: |
          set -o pipefail
          go tool -modfile=tools/go.mod gitleaks git --redact --no-color --no-banner --exit-code 1 \
            --log-opts="--full-history HEAD" . 2>&1 | tee gitleaks.log
          if grep -q ' ERR ' gitleaks.log; then echo "::error::gitleaks reported an error"; exit 1; fi
          if grep -q ' 0 commits scanned' gitleaks.log; then echo "::error::gitleaks scanned no commits"; exit 1; fi

  test:
    name: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: | # the module, govulncheck, and changie for relnotes's tests
            go.sum
            tools/go.sum
            tools/release/go.sum
      - name: go test -race
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: go test (Windows; the race detector needs a C toolchain)
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Fuzz smoke (every Fuzz target, 10s each)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          go test -list '^Fuzz' ./... |
            awk '/^Fuzz/ { t[++n] = $1 } /^ok/ { for (i = 1; i <= n; i++) print t[i], $2; n = 0 }' > fuzz-targets.txt
          test -s fuzz-targets.txt
          while read -r target pkg; do
            go test -run '^$' -fuzz "^${target}\$" -fuzztime=10s "$pkg"
          done < fuzz-targets.txt
      - name: Upload crashing fuzz inputs
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: internal/**/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14
      - name: govulncheck
        if: runner.os == 'Linux'
        run: go tool -modfile=tools/go.mod govulncheck ./...
      - name: Third-party notices are current
        if: runner.os == 'Linux'
        run: go run ./internal/tools/notices -check
      - name: Manual page is current
        if: runner.os == 'Linux'
        run: go run ./internal/tools/manpage -check
      - name: Icons are current
        if: runner.os == 'Linux'
        run: go run ./internal/tools/icons -check

  build:
    name: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # How long the platform downloads are kept: 30 days on main, 7 on other branches, 3 on PRs.
      RETENTION_DAYS: ${{ github.event_name == 'pull_request' && 3 || github.ref == 'refs/heads/main' && 30 || 7 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The release notes for this commit's snapshot version, as release.yml makes them for a tag; the
      # job summary shows them.
      - name: Release notes (snapshot)
        env:
          WOPR_NOTES_DIR: build/notes
        run: |
          go run ./internal/tools/relnotes -snapshot -out "${WOPR_NOTES_DIR}"
          { echo "## Release notes for this snapshot"; echo; cat "${WOPR_NOTES_DIR}/notes.md"; } >> "${GITHUB_STEP_SUMMARY}"
      - name: GoReleaser snapshot (all six targets, and the Linux packages)
        env:
          WOPR_NOTES_DIR: build/notes
        run: go tool -modfile=tools/release/go.mod goreleaser release --snapshot --clean --skip=publish
      # GoReleaser's .Version (1.2.4-snapshot.abc1234), which names the installers and the snaps.
      - name: Version
        id: version
        run: |
          version="$(jq -r .version dist/metadata.json)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::dist/metadata.json has no usable version: ${version}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Size gate
        run: go run ./internal/tools/sizegate -expect 6 -packages 4
      - name: Stage binaries, end-to-end tests and Linux packages
        run: go run ./internal/tools/stage -archives -assets dist/release
      # Every release file, checked against checksums.txt and still unsigned, as release.yml's build
      # uploads them for a tag: the Windows, macOS and snap jobs package these bytes and never compile
      # wopr again, and collect adds the installers to them before signing them as release.yml does.
      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/release/
          retention-days: 1
          if-no-files-found: error
      # The release's signing step (packaging/sign-packages.sh), with a key made for this run: the
      # .rpm packages are signed, and the smoke jobs install them with dnf checking the signature,
      # and check the .deb's detached signature, with this public key.
      - name: Sign the Linux packages with a throwaway key
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends rpm
          keys="$(mktemp -d)"
          GNUPGHOME="${keys}" gpg --batch --quiet --pinentry-mode loopback --passphrase '' --quick-gen-key \
            'wopr CI throwaway <ci@invalid>' rsa3072 sign 1d
          GNUPGHOME="${keys}" gpg --batch --armor --export > "${RUNNER_TEMP}/signing-key.asc"
          WOPR_SIGNING_KEY="$(GNUPGHOME="${keys}" gpg --batch --armor --export-secret-keys)" \
            packaging/sign-packages.sh dist/release "${RUNNER_TEMP}/signing-key.asc"
          GNUPGHOME="${keys}" gpgconf --kill all
          for arch in amd64:x86_64 arm64:aarch64; do
            dir="stage/linux_${arch%%:*}"
            cp dist/release/wopr-*."${arch##*:}".rpm dist/release/wopr_*_"${arch%%:*}".deb.asc "${dir}/"
            cp "${RUNNER_TEMP}/signing-key.asc" "${dir}/signing-key.asc"
          done
      # One download per platform: the bare binary, uploaded as-is rather than zipped, so the download
      # is the program itself (it prints its licences with --licenses). Each artifact is named after
      # its file, e.g. wopr_0.0.1-snapshot.1a2b3c4_linux_amd64. Downloads lose the executable bit.
      - name: Upload linux_amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/release/wopr_*_linux_amd64
          archive: false
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload linux_arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/release/wopr_*_linux_arm64
          archive: false
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload darwin_amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/release/wopr_*_darwin_amd64
          archive: false
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload darwin_arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/release/wopr_*_darwin_arm64
          archive: false
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload windows_amd64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/release/wopr_*_windows_amd64.exe
          archive: false
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
      - name: Upload windows_arm64
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/release/wopr_*_windows_arm64.exe
          archive: false
          retention-days: ${{ env.RETENTION_DAYS }}
          if-no-files-found: error
      # Every staged binary with its e2e test, and the .deb and .rpm, for this run's smoke jobs and
      # the end-to-end tests of its macOS and snap jobs.
      - name: Upload the smoke bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-bundle
          path: stage/
          retention-days: 1
          if-no-files-found: error

  # The documentation site (site/), built as docs.yml builds it for GitHub Pages: a warning, a
  # broken link or a missing screenshot fails it. docs.yml publishes it from every push to main.
  docs:
    name: docs
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: | # Hugo, and the Hextra theme (a Hugo module)
            tools/docs/go.sum
            site/go.sum
      - name: Build the site
        run: |
          go tool -modfile=tools/docs/go.mod hugo --source site --panicOnWarning --printPathWarnings \
            --minify --destination "${RUNNER_TEMP}/site"
      # docs.yml tells the site whether the latest release is signed (the has-signatures partial).
      # Build it both ways, with a throwaway key in packaging/ while the real one is missing.
      - name: Build the site as for a signed and an unsigned release
        run: |
          if [[ ! -f packaging/wopr-signing-key.asc ]]; then
            export GNUPGHOME="${RUNNER_TEMP}/gnupg"
            mkdir -m 700 "${GNUPGHOME}"
            gpg --batch --quiet --pinentry-mode loopback --passphrase '' \
              --quick-gen-key 'wopr CI throwaway <ci@invalid>' rsa3072 sign 1d
            gpg --batch --armor --export > packaging/wopr-signing-key.asc
            gpg --batch --with-colons --list-keys | awk -F: '$1 == "fpr" { print $10; exit }' \
              > packaging/wopr-signing-key.fingerprint
          fi
          for signed in true false; do
            HUGO_PARAMS_SIGNEDRELEASE="${signed}" go tool -modfile=tools/docs/go.mod hugo --source site \
              --panicOnWarning --printPathWarnings --minify --destination "${RUNNER_TEMP}/site-${signed}"
          done
          grep -q 'rpm --import' "${RUNNER_TEMP}/site-true/install/index.html"
          test -f "${RUNNER_TEMP}/site-true/wopr-signing-key.asc"
          # Not "! grep": bash -e ignores a negated command's failure.
          if grep -q 'rpm --import' "${RUNNER_TEMP}/site-false/install/index.html"; then
            echo "::error::the unsigned build imports the signing key"
            exit 1
          fi
          test ! -e "${RUNNER_TEMP}/site-false/wopr-signing-key.asc"

  smoke:
    name: smoke
    needs: build
    permissions: {}
    uses: $/.github/workflows/smoke.yml
    with:
      artifact: smoke-bundle

  # The installers and the snaps, built from the release files and tested on each platform, as
  # release.yml builds them for a tag; the snaps are never published from here. Each called
  # workflow checks out the repository for its packaging files, so it needs contents: read.
  windows:
    name: windows
    needs: build
    permissions:
      contents: read
    uses: $/.github/workflows/windows.yml
    with:
      artifact: release-dist
      version: ${{ needs.build.outputs.version }}

  macos:
    name: macos
    needs: build
    permissions:
      contents: read
    uses: $/.github/workflows/macos.yml
    with:
      artifact: release-dist
      version: ${{ needs.build.outputs.version }}
      stage-artifact: smoke-bundle

  snap:
    name: snap
    needs: build
    permissions:
      contents: read
    uses: $/.github/workflows/snap.yml
    with:
      artifact: release-dist
      version: ${{ needs.build.outputs.version }}
      stage-artifact: smoke-bundle
      publish: false

  # release.yml's collect and sign jobs on this commit's installers: they must fit the size budget
  # and join the release files and checksums.txt, which are then signed as release.yml signs them,
  # with a key made for this run, so a tag never meets the problem first.
  collect:
    name: collect
    needs: [build, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # stage and sizegate use the standard library only: no module downloads to cache.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-windows
          path: build/installers
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer-macos
          path: build/installers
      - name: Size gate (installers)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          go run ./internal/tools/sizegate -files
          "build/installers/wopr_${VERSION}_windows_setup.exe" "build/installers/wopr_${VERSION}_macos.dmg"
      - name: Add the installers to the release files and checksums.txt
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          go run ./internal/tools/stage -merge -assets dist/release
          "build/installers/wopr_${VERSION}_windows_setup.exe" "build/installers/wopr_${VERSION}_macos.dmg"
      # release.yml's sign step after collect: the installers stay as they are, and checksums.txt,
      # rewritten for the signed .rpm packages and the .deb's .asc files, still lists them, so its
      # signature and the attestation cover them.
      - name: Sign the release files with a throwaway key
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends rpm
          keys="$(mktemp -d)"
          GNUPGHOME="${keys}" gpg --batch --quiet --pinentry-mode loopback --passphrase '' --quick-gen-key \
            'wopr CI throwaway <ci@invalid>' rsa3072 sign 1d
          GNUPGHOME="${keys}" gpg --batch --armor --export > "${RUNNER_TEMP}/signing-key.asc"
          WOPR_SIGNING_KEY="$(GNUPGHOME="${keys}" gpg --batch --armor --export-secret-keys)" \
            packaging/sign-packages.sh dist/release "${RUNNER_TEMP}/signing-key.asc"
          GNUPGHOME="${keys}" gpgconf --kill all
          (cd dist/release && sha256sum --strict -c checksums.txt)
          test "$(grep -cE '  wopr_[^ ]+_(windows_setup\.exe|macos\.dmg)$' dist/release/checksums.txt)" -eq 2

  ci-ok:
    # Skipped on a pull request from this repository, like the rest. A skipped job counts as
    # passed, so a skipped check named "ci-ok" could stand in for a failed push run. GitHub does
    # not evaluate a skipped job's name, so that check is listed under this expression's text;
    # the name must stay an expression and never become plain "ci-ok".
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'ci-ok (checked by the push run)' || 'ci-ok' }}
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository)
    needs: [lint, secrets, test, build, smoke, windows, macos, snap, collect, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: OK
        run: echo "all required jobs passed"
