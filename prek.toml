#:schema https://www.schemastore.org/prek.json
minimum_prek_version = "0.5.5"
default_language_version.golang = "1.27"                 # golang hooks are built with Go 1.27.x
default_install_hook_types = ["pre-commit", "pre-push"]  # plain `prek install` installs only pre-commit
default_stages = ["pre-commit", "manual"]

[update]                 # `prek update`; `auto-update` no longer exists
cooldown_days = 14
freeze = true            # rev = "<sha>"  # frozen: vX.Y.Z

# Lower runs first; equal priority runs concurrently. Mutating fixers get distinct priorities.
[priorities]
bom = 0
eol = 1
ws = 2
eof = 3
format = 10
lint = 20

# The fixers rewrite files, so they run on commit (and in CI's --all-files run), never on push.
[[repos]]
repo = "builtin"
hooks = [
  { id = "fix-byte-order-marker", stages = ["pre-commit", "manual"], priority = "bom" },
  # Goldens are byte-exact, and so are the docs site's vendored files (.gitattributes).
  { id = "mixed-line-ending", args = ["--fix=lf"], exclude = '^site/assets/vendor/', stages = ["pre-commit", "manual"], priority = "eol" },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], exclude = '\.golden$|^site/assets/vendor/', stages = ["pre-commit", "manual"], priority = "ws" },
  { id = "end-of-file-fixer", exclude = '\.golden$|^site/assets/vendor/', stages = ["pre-commit", "manual"], priority = "eof" },
  { id = "check-yaml", priority = "lint" },
  { id = "check-toml", priority = "lint" },
  { id = "check-json", priority = "lint" },
  { id = "check-merge-conflict", priority = "lint" },
  { id = "check-case-conflict", priority = "lint" },
  { id = "check-illegal-windows-names", priority = "lint" },
  { id = "check-executables-have-shebangs", priority = "lint" },
  { id = "check-shebang-scripts-are-executable", priority = "lint" },
  { id = "check-added-large-files", args = ["--maxkb=512"], priority = "lint" },
  { id = "detect-private-key", priority = "lint" },
]

[[repos]]
repo = "https://github.com/golangci/golangci-lint"
rev = "114493f9b3e7257d29e4130f2b4a4aadefbb6845"  # frozen: v2.14.0
hooks = [
  { id = "golangci-lint-fmt", priority = "format" },
  { id = "golangci-lint-config-verify", priority = "lint" },
  { id = "golangci-lint-full", entry = "golangci-lint run", priority = "lint" },  # manifest has --fix
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"  # frozen: v8.30.1
hooks = [{ id = "gitleaks", stages = ["pre-commit"], priority = "lint" }]  # staged-only; CI scans history

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "fa412071e4f5d44d44f9e365f4676f9df92456a2"  # frozen: v1.30.1
hooks = [{ id = "zizmor", args = ["--no-progress"], priority = "lint" }]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12
hooks = [{ id = "actionlint", priority = "lint" }]  # workflow syntax; zizmor covers security

[[repos]]
repo = "https://github.com/codespell-project/codespell"
rev = "57b21406f092110c18776e39b0bda50d37c945c8"  # frozen: v2.4.3
hooks = [{ id = "codespell", args = ["--ignore-words-list", "theaterwide,recognised,falken,wopr,norad,imsai,crasher,crashers,oder,fpr", "--ignore-regex", '\\\(bu'], exclude ='^(internal/wopr/lines\.go|internal/assets/|internal/movie/scenes/|docs/reviews/|site/assets/vendor/)|(^|/)go\.(mod|sum)$|(^|/)testdata/|\.golden$', priority = "lint" }]  # reviews quote tool output verbatim; vendor is third-party

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "a6564f5d57444e123433a5c9af733e3975c77229"  # frozen: v0.11.0.1-1
hooks = [{ id = "shellcheck", args = ["--severity=style", "--enable=all"], priority = "lint" }]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
# rumdl-check needs >= v0.2.66 (a comment after rev would be lost on `prek update`)
rev = "83cecb6b523a053d7d3dfdc4798d705b505a88f9"  # frozen: v0.2.78
hooks = [
  { id = "rumdl-fmt", priority = "format" },
  { id = "rumdl-check", args = ["--disable", "MD013,MD033,MD041"], priority = "lint" },
]

[[repos]]
repo = "local"
hooks = [
  { id = "go-mod-tidy", name = "go mod tidy -diff", language = "system", entry = "go mod tidy -diff", files = '(^|/)go\.(mod|sum)$|\.go$', pass_filenames = false, priority = "lint" },
  { id = "go-mod-tidy-tools", name = "go mod tidy -diff (tools)", language = "system", entry = "go -C tools mod tidy -diff", files = '^tools/go\.(mod|sum)$', pass_filenames = false, priority = "lint" },
  { id = "go-mod-tidy-lint-tools", name = "go mod tidy -diff (lint tools)", language = "system", entry = "go -C tools/lint mod tidy -diff", files = '^tools/lint/go\.(mod|sum)$', pass_filenames = false, priority = "lint" },
  { id = "go-mod-tidy-release-tools", name = "go mod tidy -diff (release tools)", language = "system", entry = "go -C tools/release mod tidy -diff", files = '^tools/release/go\.(mod|sum)$', pass_filenames = false, priority = "lint" },
  { id = "go-mod-tidy-docs-tools", name = "go mod tidy -diff (docs tools)", language = "system", entry = "go -C tools/docs mod tidy -diff", files = '^tools/docs/go\.(mod|sum)$', pass_filenames = false, priority = "lint" },
  # The change notes parse and are short, CHANGELOG.md is changie merge's output, and every release
  # tag has its .changes/vX.Y.Z.md (AGENTS.md, "Change notes"). It builds changie on first use.
  { id = "change-notes", name = "change notes and CHANGELOG.md", language = "system", entry = "go run ./internal/tools/relnotes -check", files = '^(\.changes/|\.changie\.yaml$|CHANGELOG\.md$|internal/tools/relnotes/)', pass_filenames = false, priority = "lint" },
  # No module in any build list newer than 14 days (AGENTS.md, "Dependency cooldown"); asks the module proxy.
  { id = "dependency-cooldown", name = "dependency cooldown (14 days)", language = "system", entry = "go run ./internal/tools/cooldown -now", files = '(^|/)go\.(mod|sum)$|^tools/cooldown-exceptions\.txt$|^internal/tools/cooldown/', pass_filenames = false, priority = "lint" },
  { id = "go-test", name = "go test (short)", language = "system", entry = "go test -short ./...", types = ["go"], pass_filenames = false, stages = ["pre-push"], priority = "lint" },
  { id = "govulncheck", name = "govulncheck", language = "system", entry = "go tool -modfile=tools/go.mod govulncheck ./...", pass_filenames = false, stages = ["pre-push"], priority = "lint" },
]
