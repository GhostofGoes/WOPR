<!--
  WOPR application icon: front-panel lamps. Provenance: original (drawn for wopr).
  The master, chosen by the owner on 2026-10-09: a gunmetal frame around a recessed panel of
  four by four indicator lamps, lit amber along one diagonal (a winning tic-tac-toe line), with
  one red lamp, inside the transparent margin Windows and Linux icons have. To change the icon,
  edit the sources (packaging/icons/README.md), then run: go run ./internal/tools/icons
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>WOPR</title>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b717b"/>
      <stop offset="0.5" stop-color="#474c54"/>
      <stop offset="1" stop-color="#2e3137"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
