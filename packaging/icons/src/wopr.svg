      <stop offset="1" stop-color="#1c1f24"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f545c"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <radialGradient id="off" cx="0.42" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#4d473f"/>
      <stop offset="0.6" stop-color="#2c2925"/>
      <stop offset="1" stop-color="#1b1a18"/>
    </radialGradient>
    <radialGradient id="amber" cx="0.45" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.28" stop-color="#ffdd7a"/>
      <stop offset="0.66" stop-color="#ffaa14"/>
      <stop offset="1" stop-color="#dc6f00"/>
    </radialGradient>
    <radialGradient id="red" cx="0.45" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffece6"/>
      <stop offset="0.28" stop-color="#ff8a6c"/>
      <stop offset="0.66" stop-color="#f43c24"/>
      <stop offset="1" stop-color="#b0160b"/>
    </radialGradient>
    <radialGradient id="dim" cx="0.45" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#f0a83c"/>
      <stop offset="0.45" stop-color="#b8650c"/>
      <stop offset="1" stop-color="#4a2606"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb020" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ffa000" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff9000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff5030" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ff3a20" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff3010" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- cabinet: base edge, frame with a lit top rim, recessed panel -->
  <rect x="80" y="84" width="864" height="864" rx="184" ry="184" fill="#16181b"/>
  <rect x="80" y="72" width="864" height="864" rx="184" ry="184" fill="url(#frame)"/>
  <rect x="80" y="72" width="864" height="864" rx="184" ry="184" fill="url(#rim)"/>
  <rect x="88" y="80" width="848" height="848" rx="176" ry="176" fill="url(#frame)"/>
