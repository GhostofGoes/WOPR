# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: wopr

# internal/tools/pkgdocs writes into build/pkg what the archives and packages carry beside the
# program, from the tree and from the release notes that internal/tools/relnotes wrote into
# $WOPR_NOTES_DIR first: the manual page with this build's version in its header (for the archives,
# and compressed for the packages), the .deb's other documents compressed as `gzip -9n` writes them
# (Debian Policy §12), and the packages' changelog.yml.
#
# go-winres (pinned in tools/release/go.mod) writes the Windows program's icon, manifest and version
# information from packaging/windows/winres.json into cmd/wopr/rsrc_windows_{amd64,arm64}.syso, which
# go build links into the Windows binaries only, and .gitignore keeps out of the tree. --arch names
# both targets: its default, amd64,386, would leave the arm64 program without them. The file version
# must be four numbers, so it is the version without a snapshot suffix, plus .0; the product version
# keeps the suffix in its text. The .syso files come out the same, byte for byte, on every run, so the
# rebuild job still compares like with like.
before:
  hooks:
    - go run ./internal/tools/pkgdocs -version "{{ .Version }}" -notes "{{ .Env.WOPR_NOTES_DIR }}" -out build/pkg
    - >-
      go tool -modfile=tools/release/go.mod go-winres make --in packaging/windows/winres.json
      --out cmd/wopr/rsrc --arch amd64,arm64 --product-version "{{ .Version }}"
      --file-version "{{ index (split .Version "-") 0 }}.0"

builds:
  - id: wopr
    main: ./cmd/wopr
    binary: wopr
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]           # the default would add 386
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/GhostofGoes/WOPR/internal/version.Version={{ .Version }}
      - -X github.com/GhostofGoes/WOPR/internal/version.Commit={{ .FullCommit }}
      - -X github.com/GhostofGoes/WOPR/internal/version.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: wopr
    ids: [wopr]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:                     # pin the binary's archive entry too
      mtime: "{{ .CommitDate }}"
      owner: root
      group: root
      mode: 0755
    files:
      - src: LICENSE
        info: { mtime: "{{ .CommitDate }}", owner: root, group: root, mode: 0644 }
      - src: README.md
        info: { mtime: "{{ .CommitDate }}", owner: root, group: root, mode: 0644 }
      - src: NOTICE.md
        info: { mtime: "{{ .CommitDate }}", owner: root, group: root, mode: 0644 }
      - src: THIRD_PARTY_NOTICES.txt
        info: { mtime: "{{ .CommitDate }}", owner: root, group: root, mode: 0644 }
      # The manual page (docs/man/wopr.6 with this build's version, from pkgdocs), at the
      # archive's root as wopr.6, in the Linux and macOS archives only: Windows has no man. For
      # Windows this is a pattern that matches nothing, which GoReleaser logs as "no files
      # matched"; a missing plain path would fail the build instead.
      - src: 'build/pkg/*.{{ if eq .Os "windows" }}none{{ else }}6{{ end }}'
        strip_parent: true
        info: { mtime: "{{ .CommitDate }}", owner: root, group: root, mode: 0644 }

  # The bare binaries too, for a download that needs no unpacking. Same name as the archive, plus
  # .exe on Windows.
  - id: binaries
    ids: [wopr]
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# Linux packages for amd64 and arm64: a .deb for Debian and Ubuntu, an .rpm for Fedora, RHEL and
# openSUSE. Both are named by their format's convention (dpkg-name; name-version-release.arch), take
# Debian revision / RPM release 1 (a snapshot becomes X.Y.Z~snapshot.<commit>-1, which sorts before
# X.Y.Z-1), have no dependencies (the binary is static), and are byte-reproducible: every time is
# the commit's, the RPM build host is fixed, and the documents come from pkgdocs. Their changelogs
# come from changie's notes: relnotes writes changelog.yml into $WOPR_NOTES_DIR, and pkgdocs copies
# it to build/pkg; nfpms.changelog takes no template, so it names that fixed path.
#
# Both put wopr in the desktop's menu (docs/PLAN.md §8), in files named by its app ID: a menu entry
# that opens a terminal running wopr (pkgdocs writes one for each package, naming the program where
# that package puts it), the icon in every size of the hicolor theme (packaging/icons/hicolor, from
# internal/tools/icons, each at the same path below /usr/share/icons/hicolor), and the AppStream
# metadata that software centres show (pkgdocs). hicolor-icon-theme and desktop-file-utils refresh
# the icon cache and the menu with dpkg and rpm triggers, so the packages need no scripts.
nfpms:
  # Debian Policy §11.11 puts a game's program in /usr/games (on the PATH of every Debian and
  # Ubuntu login) and its manual page in section 6; §12.5 wants the copyright file uncompressed;
  # §12.7 wants changelog.Debian.gz (nFPM writes it from the changelog) and the upstream release
  # notes as NEWS.gz.
  - id: deb
    ids: [wopr]
    formats: [deb]
    package_name: wopr
    file_name_template: "{{ .ConventionalFileName }}"
    bindir: /usr/games
    release: "1"
    section: games
    priority: optional
    maintainer: GhostofGoes <6599820+GhostofGoes@users.noreply.github.com>
    homepage: https://github.com/GhostofGoes/WOPR
    # The synopsis (its first line) and the extended description.
    description: '{{ mustReadFile "packaging/description.txt" }}'
    changelog: build/pkg/changelog.yml
    mtime: "{{ .CommitDate }}"
    deb:
      compression: xz
      # Go links the program statically on purpose (CGO_ENABLED=0), so it runs on any distribution.
      # lintian knows Go binaries are static only when it can see a golang build dependency in
      # a Debian source package, which a package built by GoReleaser has not.
      lintian_overrides:
        - statically-linked-binary [usr/games/wopr]
    contents:
      - src: build/pkg/wopr.6.gz
        dst: /usr/share/man/man6/wopr.6.gz
        file_info: { mode: 0644 }
      - src: packaging/debian/copyright
        dst: /usr/share/doc/wopr/copyright
        file_info: { mode: 0644 }
      - src: build/pkg/NEWS.gz
        dst: /usr/share/doc/wopr/NEWS.gz
        file_info: { mode: 0644 }
      - src: build/pkg/README.md.gz
        dst: /usr/share/doc/wopr/README.md.gz
        file_info: { mode: 0644 }
      - src: build/pkg/NOTICE.md.gz
        dst: /usr/share/doc/wopr/NOTICE.md.gz
        file_info: { mode: 0644 }
      - src: build/pkg/deb/io.github.ghostofgoes.wopr.desktop
        dst: /usr/share/applications/io.github.ghostofgoes.wopr.desktop
        file_info: { mode: 0644 }
      - src: build/pkg/io.github.ghostofgoes.wopr.metainfo.xml
        dst: /usr/share/metainfo/io.github.ghostofgoes.wopr.metainfo.xml
        file_info: { mode: 0644 }
      - src: packaging/icons/hicolor/*/apps/io.github.ghostofgoes.wopr.*
        dst: /usr/share/icons/hicolor
        file_info: { mode: 0644 }

  # Fedora's packaging guidelines put games in /usr/bin like every other program (Games SIG:
  # "Binaries go in %{_bindir} and not /usr/games"), the licence texts in /usr/share/licenses as
  # %license and the documents in /usr/share/doc as %doc; the package owns both directories.
  # The manual page is compressed, as rpmbuild would leave it. Group is left unset, as Fedora asks.
  - id: rpm
    ids: [wopr]
    formats: [rpm]
    package_name: wopr
    file_name_template: "{{ .ConventionalFileName }}"
    bindir: /usr/bin
    release: "1"
    maintainer: GhostofGoes <6599820+GhostofGoes@users.noreply.github.com>
    vendor: GhostofGoes
    homepage: https://github.com/GhostofGoes/WOPR
    # SPDX: wopr's own code; abs0's transcription (NOTICE.md); the Go modules it links; and Matthew
    # Thomas's map on the big board, whose terms (NOTICE.md) have no SPDX identifier, so it gets a
    # LicenseRef with the name the .deb's copyright file gives it. The film's text is not licensed
    # at all (NOTICE.md).
    license: MIT AND BSD-2-Clause AND BSD-3-Clause AND LicenseRef-Matthew-Thomas-map
    # The extended description: description.txt without its first line, which is the summary.
    description: >-
      {{ $d := mustReadFile "packaging/description.txt" }}{{ trimprefix $d (printf "%s\n" (index (split $d "\n") 0)) }}
    changelog: build/pkg/changelog.yml
    mtime: "{{ .CommitDate }}"
    rpm:
      summary: Fan-made terminal recreation of the computer from the film WarGames # description.txt, line 1
      compression: xz
      buildhost: reproducible # the default, the build machine's name, would differ between builds
    contents:
      - src: build/pkg/wopr.6.gz
        dst: /usr/share/man/man6/wopr.6.gz
        type: doc
        file_info: { mode: 0644 }
      - dst: /usr/share/doc/wopr
        type: dir
        file_info: { mode: 0755 }
      - src: README.md
        dst: /usr/share/doc/wopr/README.md
        type: doc
        file_info: { mode: 0644 }
      - src: "{{ .Env.WOPR_NOTES_DIR }}/CHANGELOG.md"
        dst: /usr/share/doc/wopr/CHANGELOG.md
        type: doc
        file_info: { mode: 0644 }
      - dst: /usr/share/licenses/wopr
        type: dir
        file_info: { mode: 0755 }
      - src: LICENSE
        dst: /usr/share/licenses/wopr/LICENSE
        type: license
        file_info: { mode: 0644 }
      # NOTICE.md holds licence texts too (the transcription's BSD licence, the map's terms).
      - src: NOTICE.md
        dst: /usr/share/licenses/wopr/NOTICE.md
        type: license
        file_info: { mode: 0644 }
      - src: THIRD_PARTY_NOTICES.txt
        dst: /usr/share/licenses/wopr/THIRD_PARTY_NOTICES.txt
        type: license
        file_info: { mode: 0644 }
      - src: build/pkg/rpm/io.github.ghostofgoes.wopr.desktop
        dst: /usr/share/applications/io.github.ghostofgoes.wopr.desktop
        file_info: { mode: 0644 }
      - src: build/pkg/io.github.ghostofgoes.wopr.metainfo.xml
        dst: /usr/share/metainfo/io.github.ghostofgoes.wopr.metainfo.xml
        file_info: { mode: 0644 }
      - src: packaging/icons/hicolor/*/apps/io.github.ghostofgoes.wopr.*
        dst: /usr/share/icons/hicolor
        file_info: { mode: 0644 }
      # Fedora's guidelines ("File and Directory Ownership"): a package owns every directory it puts
      # files in, except those of filesystem (/usr/share/applications, /usr/share/metainfo and
      # /usr/share/icons are) and of packages it needs to work. The hicolor directories belong to
      # hicolor-icon-theme, which wopr does not need to run, so wopr owns them too, as the
      # guidelines' gtk-doc example does, with the same mode. Requiring hicolor-icon-theme instead
      # would break the docs' offline install (dnf install --disablerepo='*') where it is missing.
      # rpm leaves a directory alone while another package owns it.
      - { dst: /usr/share/icons/hicolor, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/16x16, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/16x16/apps, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/22x22, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/22x22/apps, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/24x24, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/24x24/apps, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/32x32, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/32x32/apps, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/48x48, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/48x48/apps, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/64x64, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/64x64/apps, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/128x128, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/128x128/apps, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/256x256, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/256x256/apps, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/512x512, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/512x512/apps, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/scalable, type: dir, file_info: { mode: 0755 } }
      - { dst: /usr/share/icons/hicolor/scalable/apps, type: dir, file_info: { mode: 0755 } }

checksum:
  name_template: checksums.txt       # the default would be wopr_<version>_checksums.txt
  extra_files:                       # published beside the archives, so attested with them
    - glob: ./LICENSE
    - glob: ./README.md
    - glob: ./NOTICE.md
    - glob: ./THIRD_PARTY_NOTICES.txt

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}"

report_sizes: true

release:
  disable: true                      # publishing is release.yml's publish job (gh + attest)

# Release notes come from changie's notes in .changes/: internal/tools/relnotes writes notes.md (the
# release body, published by release.yml), CHANGELOG.md and changelog.yml (nFPM's chglog format) into
# $WOPR_NOTES_DIR, build/notes in the workflows, before GoReleaser runs. nfpms.changelog is not
# templated, so it names build/pkg/changelog.yml, pkgdocs's copy. GoReleaser's own changelog, built
# from commits, stays off.
changelog:
  disable: true
